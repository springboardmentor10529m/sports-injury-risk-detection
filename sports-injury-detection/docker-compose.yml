version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: injury_risk_db
    restart: always
    environment:
      POSTGRES_DB: injury_risk_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d injury_risk_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: injury_risk_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/injury_risk_db
      - JWT_SECRET_KEY=supersecretjwtkey_change_in_production_12345
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=120
    volumes:
      - ./backend/uploads:/app/backend/uploads

volumes:
  postgres_data:
