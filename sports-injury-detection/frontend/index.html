                                            <button onClick={() => setShowAddInjury(!showAddInjury)} className="text-xs text-cyan-300 hover:text-cyan-200 font-bold flex items-center space-x-1 bg-cyan-500/20 border border-cyan-500/40 px-3 py-1.5 rounded-xl shadow-sm">

                                        {showAddInjury && (

                                                    <label className="block text-[11px] font-bold text-slate-400">Body Part</label>

                                                <div>
                                                    <label className="block text-[11px] font-bold text-slate-400">Severity</label>

                                                        <option value="Low">Low</option>
                                                        <option value="Moderate">Moderate</option>
                                                        <option value="High">High</option>

                                                <div>
                                                    <label className="block text-[11px] font-bold text-slate-400">Injury Date</label>
                                                    <input type="date" required value={newInjuryDate} onChange={e => setNewInjuryDate(e.target.value)} className="mt-1 block w-full rounded-xl bg-slate-950 border border-slate-700 py-2 px-3 text-white text-xs" />

                                                    <label className="block text-[11px] font-bold text-slate-400">Injury Type</label>
                                                    <input type="text" required value={editingInjury.injury_type} onChange={e => setEditingInjury({...editingInjury, injury_type: e.target.value})} className="mt-1 block w-full rounded-xl bg-slate-950 border border-slate-700 py-2 px-3 text-white text-xs" />

                                                    <input type="text" required value={editingInjury.body_part} onChange={e => setEditingInjury({...editingInjury, body_part: e.target.value})} className="mt-1 block w-full rounded-xl bg-slate-950 border border-slate-700 py-2 px-3 text-white text-xs" />
                                                </div>
                                                <div>
                                                    <label className="block text-[11px] font-bold text-slate-400">Severity</label>
                                                    <select value={editingInjury.severity} onChange={e => setEditingInjury({...editingInjury, severity: e.target.value})} className="mt-1 block w-full rounded-xl bg-slate-950 border border-slate-700 py-2 px-3 text-white text-xs">
                                                        <option value="Low">Low</option>
                                                        <option value="Moderate">Moderate</option>
                                                        <option value="High">High</option>
                                                    </select>
                                                </div>
                                                <div>
                                                    <label className="block text-[11px] font-bold text-slate-400">Injury Date</label>
                                                    <input type="date" required value={editingInjury.injury_date} onChange={e => setEditingInjury({...editingInjury, injury_date: e.target.value})} className="mt-1 block w-full rounded-xl bg-slate-950 border border-slate-700 py-2 px-3 text-white text-xs" />
                                                </div>
                                                <div>
                                                    <label className="block text-[11px] font-bold text-slate-400">Recovery Date</label>
                                                    <input type="date" value={editingInjury.recovery_date || ''} onChange={e => setEditingInjury({...editingInjury, recovery_date: e.target.value})} className="mt-1 block w-full rounded-xl bg-slate-950 border border-slate-700 py-2 px-3 text-white text-xs" />
                                                </div>
                                                <div>
                                                    <label className="block text-[11px] font-bold text-slate-400">Remarks</label>
                                                    <input type="text" value={editingInjury.remarks || ''} onChange={e => setEditingInjury({...editingInjury, remarks: e.target.value})} className="mt-1 block w-full rounded-xl bg-slate-950 border border-slate-700 py-2 px-3 text-white text-xs" />
                                                </div>
                                                <div className="flex space-x-2 pt-1">
                                                    <button type="submit" className="flex-1 text-center text-xs py-2.5 font-bold rounded-xl btn-electric text-white shadow-lg">Update</button>
                                                    <button type="button" onClick={() => setEditingInjury(null)} className="px-3 text-xs py-2 text-slate-400 hover:text-white font-bold">Cancel</button>
                                                </div>
                                            </form>
                                        )}

                                        <div className="space-y-3 max-h-80 overflow-y-auto pr-1">
                                            {injuries.length > 0 ? (
                                                injuries.map(inj => (
                                                    <div key={inj.injury_id} className="p-4 bg-slate-900/70 rounded-2xl border border-slate-800/80 text-xs space-y-2 glass-panel-hover">
                                                        <div className="flex justify-between items-center">
                                                            <span className="font-extrabold text-white">{inj.injury_type} ({inj.body_part})</span>
                                                            <div className="flex items-center space-x-2">
                                                                <span className={`px-2.5 py-0.5 rounded-full text-[10px] font-extrabold ${inj.severity === 'High' ? 'bg-rose-500/20 text-rose-300 border border-rose-500/40' :
                                                                    inj.severity === 'Moderate' ? 'bg-amber-500/20 text-amber-300 border border-amber-500/40' : 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40'
                                                                    }`}>{inj.severity}</span>
                                                                <button onClick={() => setEditingInjury(inj)} title="Edit Injury" className="p-1 text-slate-400 hover:text-cyan-400 transition-colors">
                                                                    <Icon name="edit" className="h-3.5 w-3.5" />
                                                                </button>
                                                                <button onClick={() => handleDeleteInjury(inj.injury_id)} title="Delete Injury" className="p-1 text-slate-400 hover:text-rose-400 transition-colors">
                                                                    <Icon name="trash" className="h-3.5 w-3.5" />
                                                                </button>
                                                            </div>
                                                        </div>
                                                        <p className="text-slate-400 text-[11px] font-semibold">Date: {inj.injury_date} {inj.recovery_date ? `| Recov: ${inj.recovery_date}` : ''}</p>
                                                        {inj.remarks && <p className="text-slate-300 text-[11px] italic font-serif">"{inj.remarks}"</p>}
                                                    </div>
                                                ))
                                            ) : (
                                                <p className="text-xs text-slate-500 text-center py-6">No injury records logged.</p>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* Analysis & Telemetry View Tab */}
                            {activeTab === 'analysis' && (
                                <div className="space-y-6 animate-fade-in">
                                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center space-y-3 sm:space-y-0">
                                        <button onClick={() => setActiveTab('dashboard')} className="flex items-center text-slate-400 hover:text-white text-xs font-bold transition-colors">
                                            <Icon name="arrow-left" className="mr-2 h-4 w-4" /> Back to Dashboard
                                        </button>

                                        {analysisData && (
                                            <div className="flex items-center space-x-3">
                                                <button onClick={() => downloadPdfReport(selectedVideoId)} className="btn-rose px-4 py-2.5 text-xs font-bold text-white rounded-xl shadow-lg flex items-center space-x-2">
                                                    <Icon name="file-text" className="h-4 w-4" />
                                                    <span>Export PDF Report</span>
                                                </button>
                                                <button onClick={() => downloadExcelReport(selectedVideoId)} className="btn-electric px-4 py-2.5 text-xs font-bold text-white rounded-xl shadow-lg flex items-center space-x-2">
                                                    <Icon name="file-spreadsheet" className="h-4 w-4" />
                                                    <span>Export Excel Sheet</span>
                                                </button>
                                            </div>
                                        )}
                                    </div>

                                    {analysisData ? (
                                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                            {/* Video Player & Biomechanical Graph */}
                                            <div className="lg:col-span-2 space-y-6">
                                                <div className="glass-panel rounded-3xl p-6 space-y-4 shadow-2xl border-t-4 border-t-cyan-400">
                                                    <h3 className="text-lg font-bold text-white font-display">Skeletal Landmark Video Player</h3>
                                                    <div className="aspect-video bg-black rounded-2xl overflow-hidden border border-slate-800 flex items-center justify-center shadow-inner">
                                                        {analysisData.filepath ? (
                                                            <video className="w-full h-full object-contain" controls>
                                                                <source src={`${API_URL}${analysisData.filepath}`} type="video/mp4" />
                                                                Your browser does not support video playback.
                                                            </video>
                                                        ) : (
                                                            <span className="text-slate-500 text-xs">Video source missing</span>
                                                        )}
                                                    </div>
                                                </div>

                                                <div className="glass-panel rounded-3xl p-6 space-y-4 shadow-2xl border-t-4 border-t-indigo-400">
                                                    <h3 className="text-lg font-bold text-white font-display">Biomechanical Telemetry Timeline</h3>
                                                    <div className="h-64 w-full relative">
                                                        <canvas ref={chartRef}></canvas>
                                                    </div>
                                                </div>

                                                {/* Movement Anomalies */}
                                                <div className="glass-panel rounded-3xl p-6 space-y-4 shadow-2xl border-t-4 border-t-rose-400">
                                                    <div className="flex items-center justify-between">
                                                        <h3 className="text-lg font-bold text-white font-display flex items-center space-x-2">
                                                            <Icon name="alert-circle" className="h-5 w-5 text-amber-400" />
                                                            <span>Detected Movement Anomalies</span>
                                                        </h3>
                                                        <span className="text-xs text-slate-400 font-bold">
                                                            {analysisData.anomalies?.length || 0} flagged events
                                                        </span>
                                                    </div>

                                                    {analysisData.anomalies && analysisData.anomalies.length > 0 ? (
                                                        <div className="space-y-3">
                                                            {analysisData.anomalies.map((an, idx) => (
                                                                <div key={idx} className="p-4 bg-slate-900/80 rounded-2xl border border-slate-800/80 space-y-2">
                                                                    <div className="flex items-center justify-between">
                                                                        <span className="text-[11px] font-mono px-3 py-1 rounded-full bg-cyan-500/20 text-cyan-300 font-bold border border-cyan-500/40">
                                                                            @{an.timestamp_seconds?.toFixed(1) || '0.0'}s (Frame {an.frame_number})
                                                                        </span>
                                                                        <span className={`text-[10px] font-extrabold px-3 py-1 rounded-full ${an.severity === 'High' ? 'bg-rose-500/25 text-rose-300 border border-rose-500/40' :
                                                                            an.severity === 'Moderate' ? 'bg-amber-500/25 text-amber-300 border border-amber-500/40' :
                                                                                'bg-blue-500/25 text-blue-300 border border-blue-500/40'
                                                                            }`}>
                                                                            {an.severity} Severity ({an.anomaly_type})
                                                                        </span>
                                                                    </div>
                                                                    <p className="text-xs text-slate-200 font-semibold">{an.description}</p>
                                                                    <div className="flex justify-between items-center text-[11px] text-slate-400 font-bold pt-1">
                                                                        <span>Affected: {an.affected_joints?.join(', ')}</span>
                                                                        <span>Confidence: {Math.round(an.confidence_score * 100)}%</span>
                                                                    </div>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    ) : (
                                                        <p className="text-xs text-slate-400 bg-slate-900/50 p-4 rounded-2xl text-center border border-slate-800">
                                                            No acute high-risk movement anomalies detected in frame telemetry.
                                                        </p>
                                                    )}
                                                </div>

                                                {/* Biomechanical metrics grid */}
                                                <div className="glass-panel rounded-3xl p-6 space-y-4 shadow-2xl border-t-4 border-t-emerald-400">
                                                    <h3 className="text-lg font-bold text-white font-display">Biomechanical Kinematic Metrics</h3>
                                                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
                                                        <div className="bg-slate-900/80 p-4 rounded-2xl border border-slate-800">
                                                            <p className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Knee Valgus</p>
                                                            <p className="text-lg font-extrabold text-cyan-400 mt-1 font-display">
                                                                {analysisData.assessment?.knee_valgus}
                                                            </p>
                                                        </div>
                                                        <div className="bg-slate-900/80 p-4 rounded-2xl border border-slate-800">
                                                            <p className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Hip Tilt</p>
                                                            <p className="text-lg font-extrabold text-white mt-1 font-display">
                                                                {analysisData.assessment?.hip_stability}°
                                                            </p>
                                                        </div>
                                                        <div className="bg-slate-900/80 p-4 rounded-2xl border border-slate-800">
                                                            <p className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Trunk Lean</p>
                                                            <p className="text-lg font-extrabold text-white mt-1 font-display">
                                                                {analysisData.assessment?.trunk_lean}°
                                                            </p>
                                                        </div>
                                                        <div className="bg-slate-900/80 p-4 rounded-2xl border border-slate-800">
                                                            <p className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Stride Length</p>
                                                            <p className="text-lg font-extrabold text-white mt-1 font-display">
                                                                {analysisData.assessment?.stride_length}m
                                                            </p>
                                                        </div>
                                                        <div className="bg-slate-900/80 p-4 rounded-2xl border border-slate-800">
                                                            <p className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Alignment</p>
                                                            <p className="text-lg font-extrabold text-white mt-1 font-display">
                                                                {analysisData.assessment?.joint_alignment}°
                                                            </p>
                                                        </div>
                                                        <div className="bg-slate-900/80 p-4 rounded-2xl border border-slate-800">
                                                            <p className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Limb Symmetry</p>
                                                            <p className="text-lg font-extrabold text-emerald-400 mt-1 font-display">
                                                                {analysisData.assessment?.symmetry_score}%
                                                            </p>
                                                        </div>
                                                        <div className="bg-slate-900/80 p-4 rounded-2xl border border-slate-800">
                                                            <p className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Fatigue Score</p>
                                                            <p className="text-lg font-extrabold text-amber-400 mt-1 font-display">
                                                                {analysisData.assessment?.fatigue_score}/10
                                                            </p>
                                                        </div>
                                                        <div className="bg-slate-900/80 p-4 rounded-2xl border border-slate-800">
                                                            <p className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Quality Score</p>
                                                            <p className="text-lg font-extrabold text-cyan-400 mt-1 font-display">
                                                                {analysisData.assessment?.movement_quality}%
                                                            </p>
                                                        </div>
                                                    </div>

                                                    <div className="bg-slate-900/60 border border-slate-800 rounded-2xl p-4 mt-2">
                                                        <h4 className="text-xs font-bold text-white uppercase tracking-wider mb-1">Posture & Technique Evaluation</h4>
                                                        <p className="text-xs text-slate-300 leading-relaxed font-medium">{analysisData.assessment?.posture_assessment}</p>
                                                    </div>
                                                </div>
                                            </div>

                                            {/* Injury Risks & Corrective Recommendations */}
                                            <div className="space-y-6">
                                                <div className="glass-panel rounded-3xl p-6 space-y-4 shadow-2xl border-t-4 border-t-rose-400">
                                                    <h3 className="text-lg font-bold text-white font-display">Injury Risk Probabilities</h3>
                                                    <div className="flex items-center space-x-4 p-4 bg-slate-900/80 rounded-2xl border border-slate-800">
                                                        <div className={`h-14 w-14 rounded-2xl flex items-center justify-center text-lg font-extrabold text-white shadow-lg font-display ${analysisData.risk?.risk_category === 'Critical' || analysisData.risk?.risk_category === 'High' ? 'bg-rose-500/25 border border-rose-500/50 text-rose-300' :
                                                            analysisData.risk?.risk_category === 'Moderate' ? 'bg-amber-500/25 border border-amber-500/50 text-amber-300' : 'bg-emerald-500/25 border border-emerald-500/50 text-emerald-300'
                                                            }`}>
                                                            {analysisData.risk?.risk_score}%
                                                        </div>
                                                        <div>
                                                            <h4 className="font-bold text-white text-sm">Overall Injury Risk</h4>
                                                            <p className="text-xs text-slate-400 capitalize font-semibold">{analysisData.risk?.risk_category} Risk Category</p>
                                                        </div>
                                                    </div>

                                                    <div className="space-y-3.5">
                                                        {[
                                                            { label: 'ACL Strain Risk', score: analysisData.risk?.acl_risk },
                                                            { label: 'Hamstring Pull Risk', score: analysisData.risk?.hamstring_risk },
                                                            { label: 'Ankle Sprain Risk', score: analysisData.risk?.ankle_sprain_risk },
                                                            { label: 'Shoulder Impingement', score: analysisData.risk?.shoulder_risk },
                                                            { label: 'Lower Back Strain', score: analysisData.risk?.lower_back_risk },
                                                        ].map(r => (
                                                            <div key={r.label} className="space-y-1.5">
                                                                <div className="flex justify-between text-xs font-bold">
                                                                    <span className="text-slate-300">{r.label}</span>
                                                                    <span className="text-white font-display">{r.score}%</span>
                                                                </div>
                                                                <div className="w-full bg-slate-900 rounded-full h-2 overflow-hidden border border-slate-800">
                                                                    <div className={`h-2 rounded-full ${r.score > 70 ? 'bg-gradient-to-r from-rose-500 to-red-600' : r.score > 40 ? 'bg-gradient-to-r from-amber-400 to-amber-600' : 'bg-gradient-to-r from-cyan-400 to-emerald-400'}`} style={{ width: `${r.score}%` }}></div>
                                                                </div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>

                                                {/* Corrective Recommendations display */}
                                                <div className="glass-panel rounded-3xl p-6 space-y-4 shadow-2xl border-t-4 border-t-cyan-400">
                                                    <h3 className="text-lg font-bold text-white font-display flex items-center space-x-2">
                                                        <Icon name="sparkles" className="h-5 w-5 text-cyan-400" />
                                                        <span>AI Corrective Recommendations</span>
                                                    </h3>

                                                    <div className="space-y-4">
                                                        {analysisData.recommendations?.exercise_recommendations?.length > 0 && (
                                                            <div>
                                                                <h4 className="text-[11px] font-extrabold text-slate-400 uppercase tracking-wider mb-2">Prescribed Exercises</h4>
                                                                <div className="space-y-2">
                                                                    {analysisData.recommendations.exercise_recommendations.map((ex, idx) => (
                                                                        <div key={idx} className="p-3 bg-slate-900/80 rounded-2xl border border-slate-800 text-xs text-slate-200 font-medium">
                                                                            <strong className="text-cyan-300 font-bold">{ex.name}</strong> {ex.reps}
                                                                        </div>
                                                                    ))}
                                                                </div>
                                                            </div>
                                                        )}

                                                        {analysisData.recommendations?.mobility_suggestions?.length > 0 && (
                                                            <div>
                                                                <h4 className="text-[11px] font-extrabold text-slate-400 uppercase tracking-wider mb-2">Mobility Drills</h4>
                                                                <ul className="list-disc pl-5 text-xs text-slate-300 space-y-1 font-medium">
                                                                    {analysisData.recommendations.mobility_suggestions.map((m, idx) => (
                                                                        <li key={idx}>{m.name}</li>
                                                                    ))}
                                                                </ul>
                                                            </div>
                                                        )}

                                                        {analysisData.recommendations?.strengthening_suggestions?.length > 0 && (
                                                            <div>
                                                                <h4 className="text-[11px] font-extrabold text-slate-400 uppercase tracking-wider mb-2">Strengthening Targets</h4>
                                                                <ul className="list-disc pl-5 text-xs text-slate-300 space-y-1 font-medium">
                                                                    {analysisData.recommendations.strengthening_suggestions.map((s, idx) => (
                                                                        <li key={idx}>{s.name}</li>
                                                                    ))}
                                                                </ul>
                                                            </div>
                                                        )}

                                                        <div>
                                                            <h4 className="text-[11px] font-extrabold text-slate-400 uppercase tracking-wider mb-1">Volume Modification Guidelines</h4>
                                                            <p className="text-xs text-slate-300 bg-slate-900/60 p-3.5 border border-slate-800 rounded-2xl font-medium">
                                                                {analysisData.recommendations?.training_modification}
                                                            </p>
                                                        </div>

                                                        <div>
                                                            <h4 className="text-[11px] font-extrabold text-slate-400 uppercase tracking-wider mb-1">Recovery Protocol</h4>
                                                            <p className="text-xs text-slate-300 bg-slate-900/60 p-3.5 border border-slate-800 rounded-2xl whitespace-pre-line font-medium">
                                                                {analysisData.recommendations?.recovery_plan}
                                                            </p>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>

                                            {/* Medical Disclaimer Banner */}
                                            <div className="lg:col-span-3 bg-amber-500/15 border border-amber-500/35 rounded-3xl p-5 flex items-start space-x-3.5 text-xs text-amber-200 shadow-xl">
                                                <Icon name="shield-alert" className="h-6 w-6 flex-shrink-0 text-amber-400 mt-0.5" />
                                                <div>
                                                    <span className="font-extrabold text-amber-300">Medical & Clinical Disclaimer:</span> This AI platform provides biomechanical movement risk screening and technique evaluation based on video pose landmarks. It is intended solely for educational, athletic training, and preventative screening purposes and does NOT provide medical diagnosis or replace consultation with a licensed healthcare professional, physical therapist, or sports medicine specialist.
                                                </div>
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="text-center py-20 text-slate-400 text-xs">Loading telemetry reports...</div>
                                    )}
                                </div>
                            )}
                        </main>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
