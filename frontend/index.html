        body {

        /* Technical Grid Background */
        .bg-tech-grid {
            background-color: #0B0D0F;
            background-image: 
                linear-gradient(to right, rgba(38, 47, 54, 0.35) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(38, 47, 54, 0.35) 1px, transparent 1px);
            background-size: 32px 32px;
        }

        /* Solid Engineered Panel */
        .panel-engineered {
            background-color: #1A1F24;
            border: 1px solid #262F36;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
        }

        .panel-engineered-sub {
            background-color: #14181C;
            border: 1px solid #20272E;
        }

        .panel-hover {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);

            border-color: #3B4752;
            transform: translateY(-2px);
            box-shadow: 0 14px 30px -5px rgba(0, 0, 0, 0.5);
        }

        /* Restrained Safety Action Buttons */
        .btn-safety {

        }
        .btn-safety:active {
            transform: scale(0.98);

        .btn-secondary-tech {
            background-color: #21272C;
            border: 1px solid #343F47;
            color: #E2E8F0;

        }
        .btn-secondary-tech:hover {
            background-color: #2A3238;
            border-color: #485663;
            color: #FFFFFF;

        .btn-danger-tech {

        }
        .btn-danger-tech:hover {

        }

        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #0B0D0F;
        }
        ::-webkit-scrollbar-thumb {
            background: #262F36;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3B4752;
        }

        /* Subtle Fade In */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Pulse landmark keypoint */
        @keyframes keypointPulse {
            0%, 100% { r: 5; opacity: 1; }
            50% { r: 8; opacity: 0.5; }
        }
        .animate-keypoint {
            animation: keypointPulse 2.5s ease-in-out infinite;

                                                                    <span className={`px-2 py-0.5 rounded text-[10px] font-bold font-mono ${
                                                                        riskAssessmentData.ml_prediction.risk_level === 'CRITICAL' || riskAssessmentData.ml_prediction.risk_level === 'HIGH' ? 'bg-[#2D1215] text-[#FCA5A5] border border-[#EF4444]' :
                                                                        riskAssessmentData.ml_prediction.risk_level === 'MODERATE' ? 'bg-[#2B2010] text-[#FCD34D] border border-[#F59E0B]' : 'bg-[#10281E] text-[#6EE7B7] border border-[#10B981]'
                                                                    }`}>
                                                                        {riskAssessmentData.ml_prediction.risk_level} RISK
                                                                    </span>
                                                                    <span className="text-[11px] text-[#94A3B8] font-mono">
                                                                        (Probability: {riskAssessmentData.ml_prediction.probability})
                                                                    </span>
                                                                </div>
                                                            </div>
                                                        </div>

                                                        {/* Feature Mapping Breakdown */}
                                                        <div className="space-y-2 text-xs">
                                                            <h4 className="text-[11px] font-bold text-[#94A3B8] uppercase tracking-wider font-display">18-Feature Engine Calibration</h4>
                                                            <div className="p-3 bg-[#14181C] rounded-xl border border-[#20272E] space-y-2">
                                                                <div>
                                                                    <span className="text-[10px] font-bold text-[#10B981] font-mono block">CONNECTED VIDEO & PROFILE FEATURES ({riskAssessmentData.ml_prediction.connected_features?.length || 0}):</span>
                                                                    <p className="text-[11px] text-[#94A3B8] font-mono mt-0.5">
                                                                        {riskAssessmentData.ml_prediction.connected_features?.join(', ') || 'None'}
                                                                    </p>
                                                                </div>
                                                                <div className="pt-1.5 border-t border-[#1F272E]">
                                                                    <span className="text-[10px] font-bold text-[#F59E0B] font-mono block">BASELINE POPULATION FALLBACKS ({riskAssessmentData.ml_prediction.baseline_fallback_features?.length || 0}):</span>
                                                                    <p className="text-[11px] text-[#94A3B8] font-mono mt-0.5">
                                                                        {riskAssessmentData.ml_prediction.baseline_fallback_features?.join(', ') || 'None'}
                                                                    </p>
                                                                </div>
                                                            </div>
                                                        </div>

                                                        <p className="text-[10px] text-[#64748B] font-mono italic">
                                                            {riskAssessmentData.ml_prediction.disclaimer || 'Educational indicator derived from tabular random forest model.'}
                                                        </p>
                                                    </div>
                                                )}

                                                {/* Corrective Recommendations */}
                                                <div className="panel-engineered rounded-2xl p-5 space-y-4 shadow-xl border-t-2 border-t-[#10B981]">
                                                    <h3 className="text-base font-bold text-white font-display flex items-center space-x-2">
                                                        <Icon name="sparkles" className="h-4 w-4 text-[#10B981]" />
                                                        <span>AI Corrective Recommendations</span>
                                                    </h3>

                                                    <div className="space-y-3.5">
                                                        {(riskAssessmentData?.recommendations?.exercise_recommendations?.length > 0 || analysisData.recommendations?.exercise_recommendations?.length > 0) && (
                                                            <div>
                                                                <h4 className="text-[11px] font-bold text-[#94A3B8] uppercase tracking-wider mb-1.5 font-display">Prescribed Exercises</h4>
                                                                <div className="space-y-1.5">
                                                                    {(riskAssessmentData?.recommendations?.exercise_recommendations || analysisData.recommendations?.exercise_recommendations || []).map((ex, idx) => (
                                                                        <div key={idx} className="p-2.5 bg-[#14181C] rounded-lg border border-[#20272E] text-xs text-[#E2E8F0]">
                                                                            <strong className="text-[#E87A24] font-bold font-display">{ex.name}</strong> — {ex.reps}
                                                                        </div>
                                                                    ))}
                                                                </div>
                                                            </div>
                                                        )}

                                                        {(riskAssessmentData?.recommendations?.mobility_suggestions?.length > 0 || analysisData.recommendations?.mobility_suggestions?.length > 0) && (
                                                            <div>
                                                                <h4 className="text-[11px] font-bold text-[#94A3B8] uppercase tracking-wider mb-1 font-display">Mobility Drills</h4>
                                                                <ul className="list-disc pl-5 text-xs text-[#94A3B8] space-y-1">
                                                                    {(riskAssessmentData?.recommendations?.mobility_suggestions || analysisData.recommendations?.mobility_suggestions || []).map((m, idx) => (
                                                                        <li key={idx}>{m.name}</li>
                                                                    ))}
                                                                </ul>
                                                            </div>
                                                        )}

                                                        {(riskAssessmentData?.recommendations?.strengthening_suggestions?.length > 0 || analysisData.recommendations?.strengthening_suggestions?.length > 0) && (
                                                            <div>
                                                                <h4 className="text-[11px] font-bold text-[#94A3B8] uppercase tracking-wider mb-1 font-display">Strengthening Targets</h4>
                                                                <ul className="list-disc pl-5 text-xs text-[#94A3B8] space-y-1">
                                                                    {(riskAssessmentData?.recommendations?.strengthening_suggestions || analysisData.recommendations?.strengthening_suggestions || []).map((s, idx) => (
                                                                        <li key={idx}>{s.name}</li>
                                                                    ))}
                                                                </ul>
                                                            </div>
                                                        )}

                                                        <div>
                                                            <h4 className="text-[11px] font-bold text-[#94A3B8] uppercase tracking-wider mb-1 font-display">Volume Modification Guidelines</h4>
                                                            <p className="text-xs text-[#94A3B8] bg-[#14181C] p-3 border border-[#20272E] rounded-xl">
                                                                {riskAssessmentData?.recommendations?.training_modification || analysisData.recommendations?.training_modification}
                                                            </p>
                                                        </div>

                                                        <div>
                                                            <h4 className="text-[11px] font-bold text-[#94A3B8] uppercase tracking-wider mb-1 font-display">Recovery Protocol</h4>
                                                            <p className="text-xs text-[#94A3B8] bg-[#14181C] p-3 border border-[#20272E] rounded-xl whitespace-pre-line">
                                                                {riskAssessmentData?.recommendations?.recovery_plan || analysisData.recommendations?.recovery_plan}
                                                            </p>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>

                                            {/* Medical Disclaimer Banner */}
                                            <div className="lg:col-span-12 bg-[#2B2010] border border-[#F59E0B] rounded-2xl p-4 flex items-start space-x-3 text-xs text-[#FCD34D] shadow-md">
                                                <Icon name="shield-alert" className="h-5 w-5 flex-shrink-0 text-[#F59E0B] mt-0.5" />
                                                <div>
                                                    <span className="font-bold text-white font-display">Medical & Clinical Disclaimer:</span> This AI platform provides biomechanical movement risk screening and technique evaluation based on video pose landmarks. It is intended solely for educational, athletic training, and preventative screening purposes and does NOT provide medical diagnosis or replace consultation with a licensed healthcare professional, physical therapist, or sports medicine specialist.
                                                </div>
                                            </div>
                                        </div>
                                    ) : analysisLoading ? (
                                        <div className="text-center py-20 text-[#94A3B8] text-xs flex flex-col items-center justify-center space-y-3 font-mono">
                                            <div className="animate-spin rounded-full h-8 w-8 border-b-2 border-[#E87A24]"></div>
                                            <span>LOADING KINEMATIC ANALYSIS & TELEMETRY REPORTS...</span>
                                        </div>
                                    ) : analysisError ? (
                                        <div className="max-w-md mx-auto my-12 p-6 panel-engineered rounded-2xl border border-[#EF4444] text-center space-y-4 shadow-xl">
                                            <Icon name="alert-circle" className="h-8 w-8 text-[#EF4444] mx-auto" />
                                            <h3 className="text-sm font-bold text-white font-display">Unable to Load Analysis</h3>
                                            <p className="text-xs text-[#FCA5A5]">{analysisError}</p>
                                            <button onClick={() => loadAnalysis(selectedVideoId)} className="btn-safety px-4 py-2 text-xs font-bold rounded-lg font-display">
                                                Retry Loading
                                            </button>
                                        </div>
                                    ) : (
                                        <div className="text-center py-20 text-[#94A3B8] text-xs font-mono">No analysis data available for this video.</div>
                                    )}
                                </div>
                            )}
                        </main>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
