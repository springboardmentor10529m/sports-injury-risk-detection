<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Smart Athlete</title>
    

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family: Arial, sans-serif;

            background: #f5f7fb;

            color: #1f2937;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;
        }


        .login-container {
            width: 420px;

            background: white;

            padding: 40px;

            border-radius: 16px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }


        .logo {
            text-align: center;

            color: #2563eb;

            font-size: 28px;

            font-weight: bold;

            margin-bottom: 10px;
        }


        h2 {
            text-align: center;

            margin-bottom: 10px;
        }


        .subtitle {
            text-align: center;

            color: #6b7280;

            margin-bottom: 30px;
        }


        .form-group {
            margin-bottom: 18px;
        }


        label {
            display: block;

            margin-bottom: 7px;

            font-weight: 600;
        }


        input {
            width: 100%;

            padding: 12px;

            border: 1px solid #d1d5db;

            border-radius: 8px;

            font-size: 15px;
        }


        input:focus {
            outline: none;

            border-color: #2563eb;
        }


        .login-btn {
            width: 100%;

            padding: 13px;

            background: #2563eb;

            color: white;

            border: none;

            border-radius: 8px;

            font-size: 16px;

            cursor: pointer;

            margin-top: 10px;
        }


        .login-btn:hover {
            background: #1d4ed8;
        }


        .login-btn:disabled {
            background: #93c5fd;

            cursor: not-allowed;
        }


        .register-link {
            text-align: center;

            margin-top: 20px;

            color: #6b7280;
        }


        .register-link a {
            color: #2563eb;

            text-decoration: none;

            font-weight: 600;
        }

    </style>

</head>


<body>


    <div class="login-container">


        <div class="logo">
            Smart Athlete
        </div>


        <h2>
            Welcome Back
        </h2>


        <p class="subtitle">
            Login to your athlete account
        </p>


        <form id="loginForm">


            <div class="form-group">

                <label for="email">
                    Email
                </label>


                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>


                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-btn"
                id="loginButton"
            >
                Login
            </button>


        </form>


        <div class="register-link">

            Don't have an account?

            <a href="register.html">
                Register
            </a>

        </div>


    </div>


    <script>

        const loginForm =
            document.getElementById("loginForm");


        const loginButton =
            document.getElementById("loginButton");


        loginForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const email =
                    document.getElementById("email")
                    .value
                    .trim();


                const password =
                    document.getElementById("password")
                    .value;


                /*
                    Disable button while login
                    request is being processed.
                */

                loginButton.disabled = true;

                loginButton.textContent = "Logging in...";


                try {


                    /*
                        Send login information
                        to Django.
                    */

                    const response = await fetch(
                        "http://127.0.0.1:8000/api/login/",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify({

                                email: email,

                                password: password

                            })
                        }
                    );


                    /*
                        Convert Django response
                        into JavaScript object.
                    */

                    const data =
                        await response.json();


                    /*
                        Login successful
                    */

                    if (response.ok) {


                        /*
                            Save authentication token.

                            We will use this later when
                            sending athlete details and
                            video to Django.
                        */

                        localStorage.setItem(
                            "authToken",
                            data.token
                        );


                        /*
                            Save user information
                            for later use.
                        */

                        localStorage.setItem(
                            "user",
                            JSON.stringify(data.user)
                        );


                        alert(
                            data.message ||
                            "Login successful."
                        );


                        /*
                            Go to dashboard.
                        */

                        window.location.href =
                            "dashboard.html";

                    }


                    /*
                        Login failed
                    */

                    else {


                        if (data.non_field_errors) {

                            alert(
                                data.non_field_errors[0]
                            );

                        }

                        else if (data.email) {

                            alert(
                                data.email[0]
                            );

                        }

                        else if (data.password) {

                            alert(
                                data.password[0]
                            );

                        }

                        else {

                            alert(
                                "Login failed. Please check your details."
                            );

                        }

                    }

                }


                /*
                    Django server could not
                    be reached.
                */

                catch (error) {

                    console.error(
                        "Login error:",
                        error
                    );


                    alert(
                        "Unable to connect to the server. Please make sure the Django server is running."
                    );

                }


                finally {

                    loginButton.disabled = false;

                    loginButton.textContent = "Login";

                }

            }

        );

    </script>


</body>

</html>
