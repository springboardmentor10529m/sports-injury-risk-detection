# Standalone deployment: do not combine with the development Compose file.
name: injuryguard-production
x-backend: &backend
  image: injuryguard-backend:local
  build:
    context: ./backend
    dockerfile: Dockerfile.production
  environment: &environment
    ENVIRONMENT: production
    PROCESSING_MODE: worker
    DATABASE_HOST: postgres
    DATABASE_USER: injuryguard
    DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    DATABASE_NAME: injury_guard
    JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY}
    CORS_ORIGINS: https://${APP_DOMAIN:?Set APP_DOMAIN}
    REGISTRATION_EMAILS: ${REGISTRATION_EMAILS:-}
    MAX_UPLOAD_MB: 50
    MAX_VIDEO_SECONDS: 30
    MAX_SAMPLED_FRAMES: 300
    DELETE_PROCESSED_UPLOADS: "false"
    UPLOAD_DIR: /app/uploads
    OMP_NUM_THREADS: 1
    OPENBLAS_NUM_THREADS: 1
  volumes:
    - uploads:/app/uploads
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  logging: &logging
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: injuryguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: injury_guard
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U injuryguard -d injury_guard"]
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: 512m
    logging: *logging

  migrate:
    <<: *backend
    command: [python, -m, app.core.schema]
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    <<: *backend
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:8000/api/ready]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 768m

  worker:
    <<: *backend
    command: [python, -m, app.worker]
    restart: unless-stopped
    stop_grace_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 1536m
    cpus: 1.5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.production
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${APP_DOMAIN:?Set APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 256m
    logging: *logging

volumes:
  postgres:
  uploads:
  caddy_data:
  caddy_config:
