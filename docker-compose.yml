name: safemove

services:
  postgres:
    image: postgres:16-alpine
    container_name: safemove_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-safemove}
      POSTGRES_USER: ${POSTGRES_USER:-safemove}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-safemove_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-safemove} -d ${POSTGRES_DB:-safemove}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - safemove_network
    expose:
      - "5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: prod
    container_name: safemove_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-safemove}:${POSTGRES_PASSWORD:-safemove_dev}@postgres:5432/${POSTGRES_DB:-safemove}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-safemove-jwt-secret-key-change-in-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      VIDEO_STORAGE_PATH: /app/storage/videos
      POSE_MODEL_PATH: /app/app/ml/pose/pose_landmarker_lite.task
      DEBUG: "false"
      ENVIRONMENT: production
    volumes:
      - safemove_uploads:/app/storage/videos
      - safemove_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - safemove_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    container_name: safemove_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - safemove_network

volumes:
  postgres_data:
    name: safemove_postgres_data
  safemove_data:
    name: safemove_data
  safemove_uploads:
    name: safemove_uploads

networks:
  safemove_network:
    name: safemove_network
    driver: bridge
